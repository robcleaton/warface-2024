<style>
  @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900&display=swap');

  body {
   	font-family: 'Calibre', sans-serif;
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    background: red;
  }


  .wrapper {
    position: relative;
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  .container {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
  }

  .container.active {
    opacity: 1;
    transform: translateY(0);
  }

  .line {
    font-size: 40px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
  }

  .line.show {
    opacity: 1;
    transform: translateY(0);
  }

  p {
    font-size: 40px;
    margin-bottom: 0px;
  }
</style>

<div class="wrapper">
     <p>Hello, this is a paragraph</p>

    <div class="container">
        <div class="line">Hello, this is line 1.</div>
        <div class="line">And here is line 2.</div>
    </div>
    <div class="container">
        <div class="line">This is the second set.</div>
        <div class="line">Another line appears.</div>
    </div>
    <div class="container">
        <div class="line">Here comes the third one.</div>
        <div class="line">And a second line too.</div>
    </div>
    <div class="container">
        <div class="line">Finally, the fourth set.</div>
        <div class="line">It loops back again!</div>
    </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
     const containers =      document.querySelectorAll('.container');
     let index = 0;

     function showNext() {
         // Hide all containers and lines
         containers.forEach(el => {
             el.classList.remove('active');
             el.querySelectorAll('.line').forEach(line => line.classList.remove('show'));
         });

         // Show the next container
         const currentContainer = containers[index];
         currentContainer.classList.add('active');

         // Animate lines separately with a small delay
         const lines = currentContainer.querySelectorAll('.line');
         lines.forEach((line, i) => {
             setTimeout(() => {
                 line.classList.add('show');
             }, i * 500); // Delay for each line
         });

         // Move to the next container in cycle
         index = (index + 1) % containers.length;
     }

     showNext(); // Show first container immediately
     setInterval(showNext, 3000); // Change every 3 seconds
 });
</script>
